name: tra_list
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  barcode: ^2.2.6
  crypto: ^3.0.6
  cloud_firestore: ^6.0.2
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  file_picker: ^10.3.3
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  firebase_storage: ^13.0.2
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_speed_dial: ^7.0.0
  flutter_pos_printer_platform_image_3: ^1.2.4
  get: ^4.6.6
  get_storage: ^2.1.1
  image_picker: ^1.2.0
  intl: ^0.20.2
  open_filex: ^4.7.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  pdf: ^3.10.4
  printing: ^5.11.0
  qr: ^3.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  syncfusion_flutter_charts: ^31.1.23
  universal_html: ^2.2.4
  url_launcher: ^6.3.2
  uuid: ^4.4.0
  cloud_functions: ^6.5.0
  share_plus: ^12.0.2
  firebase_messaging: ^16.7.0
  geolocator: ^14.0.2
  webview_flutter: ^4.13.1

  http: any
  path: any
  image: ^4.3.0
  mobile_scanner: ^7.4.2
  zxing_lib: ^1.1.4
  web: ^1.1.1
  google_sign_in: ^7.2.0
  just_audio: ^0.10.6
  visibility_detector: ^0.4.0+2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  video_player: ^2.10.1
  video_compress: ^3.1.4
  record: ^6.2.1
  record_web: ^1.3.0
  flutter_webrtc: ^1.6.3
  flutter_contacts: ^2.1.0
  flutter_tts: ^4.2.5
  flutter_pcm_sound: ^3.3.3
  speech_to_text: ^7.4.0
  wakelock_plus: ^1.4.0
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  # Vendored copy of fake_cloud_firestore 4.1.1 with a one-line fix for
  # cloud_firestore 6.10 (the published releases need a newer Flutter SDK).
  fake_cloud_firestore:
    path: packages/fake_cloud_firestore
  firebase_core_platform_interface: 8.1.1

dependency_overrides:
  # The local fake_cloud_firestore fork requires 0.28; this printer plugin
  # declares 0.27, while the APIs it uses remain compatible with 0.28.
  rxdart: ^0.28.0

flutter_launcher_icons:
  image_path: "assets/mjas.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/mjas.png"
    background_color: "#012A62"
    theme_color: "#012A62"
  windows:
    generate: true
    image_path: "assets/mjas.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/mjas.png"

flutter:
  uses-material-design: true

  # Optional: add real images if you want to show them in the UI
  assets:
    - assets/isher.png
    - assets/mjas.png
    - assets/lidox_logo.png
    - assets/qr.png # QR code image
    - assets/tra-logo.png # Old TRA logo
    - assets/frame.png # Fallback QR frame
    - assets/analytics_advice.json
    - assets/isher_voice_sample.csv
    # Fallback QR frame
    - assets/fonts/

  fonts:
    - family: Hypermarket
      fonts:
        - asset: assets/fonts/Hypermarket-Cond.ttf
        - asset: assets/fonts/Hypermarket-CondBold.ttf
          weight: 700
