name: tra_list
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  barcode: ^2.2.6
  crypto: ^3.0.6
  cloud_firestore: ^6.0.2
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  file_picker: ^10.3.3
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  firebase_storage: ^13.0.2
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_speed_dial: ^7.0.0
  get: ^4.6.6
  get_storage: ^2.1.1
  image_picker: ^1.2.0
  intl: ^0.20.2
  open_filex: ^4.7.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  pdf: ^3.10.4
  printing: ^5.11.0
  qr: ^3.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  syncfusion_flutter_charts: ^31.1.23
  universal_html: ^2.2.4
  url_launcher: ^6.3.2
  uuid: ^4.4.0
  cloud_functions: ^6.5.0
  share_plus: ^12.0.2
  firebase_messaging: ^16.7.0
  webview_flutter: ^4.13.1

  http: any
  path: any
  image: ^4.3.0
  mobile_scanner: ^7.4.2
  zxing_lib: ^1.1.4
  web: ^1.1.1
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  # Vendored copy of fake_cloud_firestore 4.1.1 with a one-line fix for
  # cloud_firestore 6.10 (the published releases need a newer Flutter SDK).
  fake_cloud_firestore:
    path: packages/fake_cloud_firestore

flutter_launcher_icons:
  image_path: "assets/mjas.png"
  android: "ic_launcher"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/mjas.png"
    background_color: "#002868"
    theme_color: "#002868"
  windows:
    generate: true
    image_path: "assets/mjas.png"
    icon_size: 256

flutter:
  uses-material-design: true

  # Optional: add real images if you want to show them in the UI
  assets:
    - assets/mjas.png
    - assets/lidox_logo.png
    - assets/logo.png # Your company or app logo
    - assets/qr.png # QR code image
    - assets/tra-logo.png # Old TRA logo
    - assets/frame.png # Fallback QR frame
    - assets/social_icons.png
    - assets/analytics_advice.json
    # Fallback QR frame
    - assets/fonts/

  fonts:
    - family: Hypermarket
      fonts:
        - asset: assets/fonts/Hypermarket-Cond.ttf
        - asset: assets/fonts/Hypermarket-CondBold.ttf
          weight: 700
