name: tra_list
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  barcode: ^2.2.6
  cloud_firestore: ^6.0.2
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.3
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  firebase_storage: ^13.0.2
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  get: ^4.6.6
  image_picker: ^1.2.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  pdf: ^3.10.4
  printing: ^5.11.0
  qr: ^3.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Optional: add real images if you want to show them in the UI
  assets:
    - assets/lidox_logo.png
    - assets/logo.png # Your company or app logo
    - assets/qr.png # QR code image
    - assets/tra-logo.png # Old TRA logo
    - assets/frame.png # Fallback QR frame
    - assets/social_icons.png # Fallback QR frame
    - assets/fonts/

  fonts:
    - family: Hypermarket
      fonts:
        - asset: assets/fonts/Hypermarket-Cond.ttf
        - asset: assets/fonts/Hypermarket-CondBold.ttf
          weight: 700
