name: tra_list
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  barcode: ^2.2.6
  cloud_firestore: ^6.0.2
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  flutter:
    sdk: flutter
  get: ^4.6.6
  path_provider: ^2.1.5
  pdf: ^3.10.4
  printing: ^5.11.0
  qr: ^3.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Optional: add real images if you want to show them in the UI
  assets:
    - assets/logo.png
    - assets/qr.png
    - assets/tra-logo.png
    - assets/frame.png
    - assets/fonts/
    - assets/tra-logo.png
    - assets/fonts/Hypermarket-Cond.ttf
    - assets/fonts/Hypermarket-CondBold.ttf

  fonts:
    - family: Hypermarket
      fonts:
        - asset: assets/fonts/Hypermarket-Cond.ttf
        - asset: assets/fonts/Hypermarket-CondBold.ttf
          weight: 700
