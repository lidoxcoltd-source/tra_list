<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#012A62">
  <meta name="description" content="Mjasi POS helps your business manage sales, inventory, receipts, and daily operations in one simple workspace.">
  <meta name="keywords" content="Mjasi POS, point of sale, sales management, inventory, receipts, business management">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mjasi POS">
  <meta property="og:description" content="Manage sales, inventory, receipts, and daily operations in one simple workspace.">
  <meta property="og:url" content="https://mjasipos.web.app/">
  <meta property="og:image" content="https://mjasipos.web.app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mjasi POS">
  <meta name="twitter:description" content="A simple workspace for your sales, inventory, and business operations.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mjasi POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Mjasi POS</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #06152E;
      color: #EAF6FF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(36, 182, 255, .24), transparent 36%),
        radial-gradient(ellipse at 82% 82%, rgba(51, 104, 255, .24), transparent 38%),
        linear-gradient(135deg, #041126 0%, #082A55 52%, #073B59 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity 360ms ease, visibility 360ms ease;
    }

    #app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #app-loading::before {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(137, 221, 255, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(137, 221, 255, .045) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(ellipse at center, #000 12%, transparent 78%);
      content: "";
      pointer-events: none;
    }

    .loading-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 17px;
      width: min(100%, 320px);
      text-align: center;
      animation: arrive 800ms cubic-bezier(.2, .75, .25, 1) both;
    }

    .brand-mark {
      display: grid;
      width: 86px;
      height: 86px;
      padding: 10px;
      border: 1px solid rgba(126, 231, 255, .55);
      border-radius: 25px;
      background: rgba(59, 188, 255, .11);
      box-shadow: 0 0 34px rgba(43, 190, 255, .28), inset 0 0 24px rgba(43, 190, 255, .12);
      animation: glow 2.4s ease-in-out infinite;
      place-items: center;
    }

    .brand-mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-name {
      margin: 0;
      color: #F4FBFF;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .loading-kicker {
      margin: -8px 0 2px;
      color: #80DFFF;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .loading-message {
      min-height: 24px;
      margin: 2px 0 0;
      color: #D2E9F7;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: .015em;
      animation: message-in 450ms ease both;
    }

    .loading-track {
      width: min(100%, 260px);
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(191, 226, 255, .13);
    }

    .loading-progress {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #43DFFF, #73A7FF);
      box-shadow: 0 0 16px rgba(67, 223, 255, .7);
      transition: width 240ms ease-out;
    }

    .loading-percent {
      margin: -7px 0 0;
      color: #80DFFF;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      letter-spacing: .08em;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 24px rgba(43, 190, 255, .2), inset 0 0 18px rgba(43, 190, 255, .1); }
      50% { box-shadow: 0 0 42px rgba(43, 190, 255, .43), inset 0 0 28px rgba(43, 190, 255, .2); }
    }

    @keyframes message-in {
      from { opacity: .35; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      .loading-content { gap: 15px; }
      .brand-mark { width: 76px; height: 76px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-content">
      <div class="brand-mark">
        <img src="icons/Icon-192.png" alt="">
      </div>
      <h1 class="brand-name">Mjasi POS</h1>
      <p class="loading-kicker">SMART BUSINESS WORKSPACE</p>
      <p class="loading-message" id="loading-message">Inaamsha mfumo wako wa biashara...</p>
      <div class="loading-track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="loading-progress" id="loading-progress"></span>
      </div>
      <p class="loading-percent" id="loading-percent" aria-live="off">0%</p>
    </div>
  </div>
  <script>
    (function () {
      const messages = [
        "Inaamsha mfumo wako wa biashara...",
        "Inaandaa zana zako za mauzo...",
        "Inapakia nafasi yako ya kazi...",
        "Karibu, tunakaribia kumaliza..."
      ];
      const message = document.getElementById("loading-message");
      const progress = document.getElementById("loading-progress");
      const track = document.querySelector(".loading-track");
      const percentLabel = document.getElementById("loading-percent");
      let index = 0;
      const startedAt = performance.now();
      function updateProgress(value) {
        if (progress) progress.style.width = value + "%";
        if (track) track.setAttribute("aria-valuenow", String(value));
        if (percentLabel) percentLabel.textContent = value + "%";
      }
      const messageTimer = window.setInterval(function () {
        if (!message || !document.getElementById("app-loading")) return;
        index = (index + 1) % messages.length;
        message.textContent = messages[index];
      }, 2400);
      const progressTimer = window.setInterval(function () {
        const elapsed = performance.now() - startedAt;
        const estimate = Math.min(99, Math.floor(100 * (1 - Math.exp(-elapsed / 10000))));
        updateProgress(estimate);
      }, 120);
      window.addEventListener("flutter-first-frame", function () {
        window.clearInterval(messageTimer);
        window.clearInterval(progressTimer);
        updateProgress(100);
        if (message) message.textContent = "Tayari, karibu kwenye Mjasi POS.";
      }, { once: true });
    })();
  </script>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      const loading = document.getElementById("app-loading");
      if (!loading) return;
      loading.classList.add("is-hidden");
      window.setTimeout(function () {
        loading.remove();
      }, 400);
    }, { once: true });
  </script>
  <script>
    window.flutterWebRenderer = "html";
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
