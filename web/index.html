<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10233F">
  <meta name="description" content="Mjasi POS helps your business manage sales, inventory, receipts, and daily operations in one simple workspace.">
  <meta name="keywords" content="Mjasi POS, point of sale, sales management, inventory, receipts, business management">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mjasi POS">
  <meta property="og:description" content="Manage sales, inventory, receipts, and daily operations in one simple workspace.">
  <meta property="og:url" content="https://mjasipos.web.app/">
  <meta property="og:image" content="https://mjasipos.web.app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mjasi POS">
  <meta name="twitter:description" content="A simple workspace for your sales, inventory, and business operations.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mjasi POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Mjasi POS</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F5F7FB;
      color: #17263D;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #F5F7FB;
      opacity: 1;
      visibility: visible;
      transition: opacity 360ms ease, visibility 360ms ease;
    }

    #app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: min(100%, 220px);
      text-align: center;
      animation: arrive 650ms cubic-bezier(.2, .75, .25, 1) both;
    }

    .brand-mark {
      display: grid;
      width: 72px;
      height: 72px;
      place-items: center;
    }

    .brand-mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-name {
      margin: 0;
      color: #10233F;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: .015em;
    }

    .loading-track {
      width: 72px;
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: #DCE4F0;
    }

    .loading-track::after {
      display: block;
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: #2457D6;
      content: "";
      animation: progress 1.8s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    @keyframes progress {
      0% { transform: translateX(-110%); }
      60%, 100% { transform: translateX(270%); }
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-content">
      <div class="brand-mark">
        <img src="icons/Icon-192.png" alt="">
      </div>
      <h1 class="brand-name">Mjasi POS</h1>
      <div class="loading-track" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      const loading = document.getElementById("app-loading");
      if (!loading) return;
      loading.classList.add("is-hidden");
      window.setTimeout(function () {
        loading.remove();
      }, 400);
    }, { once: true });
  </script>
  <script>
    window.flutterWebRenderer = "html";
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
